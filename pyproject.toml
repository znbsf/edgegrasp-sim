[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "edgegrasp-sim"
version = "0.1.0"
description = "Deterministic, replayable grasp-pipeline core for SO-101 simulation"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "EdgeGrasp contributors" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
mujoco-smoke = [
  "mujoco>=3.3,<3.4",
  "numpy>=1.26,<3",
]

[project.scripts]
edgegrasp = "edgegrasp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"edgegrasp.contracts" = ["*.json"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
pythonpath = ["src"]
testpaths = ["tests"]
