# EdgeGrasp Gazebo-only experiment overlay.
#
# The arm contract and both FollowJointTrajectory action names remain unchanged.
# Only the simulated gripper adds a bounded effort command alongside position.
# This file is not a hardware configuration and does not modify pinned upstream.
controller_manager:
  ros__parameters:
    update_rate: 100

    arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController
    gripper_controller:
      type: joint_trajectory_controller/JointTrajectoryController
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

arm_controller:
  ros__parameters:
    joints:
      - shoulder_pan
      - shoulder_lift
      - elbow_flex
      - wrist_flex
      - wrist_roll
    command_interfaces:
      - position
    state_interfaces:
      - position
    open_loop_control: false
    allow_integration_in_goal_trajectories: true
    allow_nonzero_velocity_at_trajectory_end: true

gripper_controller:
  ros__parameters:
    joints:
      - gripper
    command_interfaces:
      - position
      - effort
    state_interfaces:
      - position
      - velocity
    allow_integration_in_goal_trajectories: true
    allow_nonzero_velocity_at_trajectory_end: true
